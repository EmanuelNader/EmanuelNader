name: Build profile

on:
  schedule:
    - cron: "17 8 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - .github/workflows/build-profile.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Render README and SVGs
        run: node scripts/build-profile.mjs
        env:
          # Optional: add a PROFILE_TOKEN secret (classic PAT, read:user) to count
          # private contributions in the header. Falls back to the built-in token.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile
          git diff --cached --quiet || git commit -m "Refresh profile"
          git push
