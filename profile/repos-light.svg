<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="124" viewBox="0 0 1200 124" role="img" aria-label="More projects: shotclock, steady"><style>
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
.open{animation:open 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes open{from{clip-path:inset(50% 0 50% 0)}to{clip-path:inset(0 0 0 0)}}
.fade{animation:fade .6s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tw{animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.08}}
.cf{opacity:0;animation-name:show;animation-timing-function:linear}
@keyframes show{from,to{opacity:1}}
.cfin{animation-name:hide;animation-timing-function:step-end}
@keyframes hide{from,to{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.rise,.open,.fade,.tw,.pulse,.cfin{animation:none}.cf{display:none}}
</style><rect x=".5" y=".5" width="1199" height="123" fill="#ffffff" stroke="#d0d7de"/><g class="fade" style="animation-delay:1.50s"><text class="m" x="20" y="38" font-size="18" font-weight="600" fill="#1f2328">shotclock</text><text class="s" x="190" y="38" font-size="18" fill="#1f2328">Shared night-out timelines with live group sync and a custom design system.</text><text class="m" x="900" y="38" font-size="15" fill="#656d76">React Native</text><text class="m" x="1180" y="38" font-size="15" fill="#656d76" text-anchor="end">private</text></g><line x1="0" y1="62" x2="1200" y2="62" stroke="#d0d7de"/><g class="fade" style="animation-delay:1.62s"><text class="m" x="20" y="100" font-size="18" font-weight="600" fill="#1f2328">steady</text><text class="s" x="190" y="100" font-size="18" fill="#1f2328">Wrist-worn BAC estimator: nRF52840 firmware streams IMU data over BLE.</text><text class="m" x="900" y="100" font-size="15" fill="#656d76">C · Zephyr</text><text class="m" x="1180" y="100" font-size="15" fill="#656d76" text-anchor="end">private</text></g></svg>